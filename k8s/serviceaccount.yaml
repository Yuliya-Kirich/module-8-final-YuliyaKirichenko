
apiVersion: v1
kind: ServiceAccount
metadata:
  name: taxi-s3-sa
  namespace: std
  annotations:
    serving.kserve.io/s3-endpoint: storage.yandexcloud.net
    serving.kserve.io/s3-usehttps: "1"
    serving.kserve.io/s3-region: ru-central1
    serving.kserve.io/s3-usevirtualbucket: "0"
secrets:
  - name: taxi-s3-secret
